<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glowing Badge Container -->
  <rect x="15" y="15" width="170" height="170" rx="36" fill="url(#bgGrad)" filter="url(#glow)" opacity="0.9" />
  <rect x="16" y="16" width="168" height="168" rx="35" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />

  <!-- Abstract Document Card -->
  <rect x="52" y="44" width="96" height="112" rx="12" fill="url(#docGrad)" />
  
  <!-- Document Content Lines -->
  <rect x="68" y="62" width="44" height="6" rx="3" fill="#4F46E5" />
  <rect x="68" y="76" width="64" height="4" rx="2" fill="#9CA3AF" />
  <rect x="68" y="86" width="56" height="4" rx="2" fill="#9CA3AF" />
  <rect x="68" y="96" width="60" height="4" rx="2" fill="#9CA3AF" />

  <!-- ATS Checkmark Badge -->
  <circle cx="125" cy="125" r="22" fill="#10B981" />
  <path d="M115 125 L122 132 L136 118" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Spark Star -->
  <path d="M125 48 L128 56 L136 59 L128 62 L125 70 L122 62 L114 59 L122 56 Z" fill="#F59E0B" />
</svg>
